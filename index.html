<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>밀양손씨 목사공파 가계도</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1a1d21; --ink-2:#5a6169; --ink-3:#9aa2ab;
  --line:#d9dee3; --line-2:#eef1f4;
  --paper:#fbfaf8; --card:#ffffff;
  --seal:#8c2f2a; --seal-soft:#f3e3e1;
  --gold:#b08840; --unknown:#f0f0ee; --me:#1a1d21;
  --drop:#2f6b8c; --drop-soft:#e2eef4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
  background:var(--paper);color:var(--ink);overflow:hidden;font-feature-settings:"tnum"}

header{position:fixed;top:0;left:0;right:0;height:52px;z-index:30;
  background:rgba(251,250,248,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
.brand{display:flex;flex-direction:column;justify-content:center;
  line-height:1.05;white-space:nowrap;flex:none;padding-right:2px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.03em}
.brand em{font-style:normal;color:var(--seal)}
.brand span{font-size:8.5px;font-weight:600;color:var(--ink-3);letter-spacing:.03em;margin-top:1px}
.hstat{font-size:11px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  height:30px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal)}
.viewseg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:30px;flex:none}
.viewseg button{border:0;background:var(--card);color:var(--ink-2);padding:0 11px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border-right:1px solid var(--line)}
.viewseg button:last-child{border-right:0}
.viewseg button.on{background:var(--ink);color:#fff}

#stage{position:absolute;inset:52px 0 0 0;overflow:auto;background:
  linear-gradient(var(--line-2) 1px,transparent 1px) 0 0/100% 28px}
#stage.pan{cursor:grab}
#stage.pan.grabbing{cursor:grabbing}
#stage.list{background:var(--paper);cursor:default}
#world{position:relative;transform-origin:0 0}
svg#wires{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
#wires path{fill:none;stroke:var(--line);stroke-width:1.5}

.genband{position:absolute;left:0;display:flex;align-items:center;border-top:1px dashed var(--line)}
.genband span{position:sticky;left:8px;font-size:10px;font-weight:800;color:var(--ink-3);
  background:var(--paper);padding:2px 6px;border-radius:4px}

.node{position:absolute;width:var(--nw);height:var(--nh);
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:grab;transition:box-shadow .12s,border-color .12s;
  box-shadow:0 1px 2px rgba(0,0,0,.04);touch-action:none}
.node:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);border-color:var(--ink-3);z-index:5}
.node .nm{font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.2;pointer-events:none}
.node .sub{font-size:9px;color:var(--ink-3);margin-top:1px;line-height:1;pointer-events:none}
.node.unknown{background:var(--unknown);border-style:dashed;border-color:var(--ink-3)}
.node.unknown .nm{color:var(--ink-3);font-weight:800}
.node.me{background:var(--me);border-color:var(--me)}
.node.me .nm{color:#fff}
.node.me .sub{color:#8b939c}
.node.sel{border-color:var(--seal);border-width:2px;box-shadow:0 0 0 4px var(--seal-soft)}
.node.dragging{opacity:.35;cursor:grabbing}
.node.dropok{border-color:var(--drop);border-width:2px;background:var(--drop-soft);box-shadow:0 0 0 5px rgba(47,107,140,.15)}
.node.dropbad{border-color:var(--seal);border-style:dashed;opacity:.5}
.chip{position:absolute;top:-7px;right:-7px;background:var(--seal);color:#fff;
  font-size:9px;font-weight:800;padding:2px 5px;border-radius:20px;line-height:1.2;
  white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none}
.node.me .chip{background:var(--gold)}
.scount{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--line);color:var(--ink-3);
  font-size:8px;font-weight:800;padding:0 4px;border-radius:20px;line-height:13px;
  pointer-events:none;font-variant-numeric:tabular-nums}
.node.me .scount{border-color:#3a4048;background:#2a2f36;color:#9aa2ab}
.dot{position:absolute;top:5px;left:5px;width:4px;height:4px;border-radius:50%;background:var(--gold);pointer-events:none}

#zoom{position:fixed;right:14px;bottom:14px;z-index:28;display:flex;align-items:stretch;
  background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;
  box-shadow:0 3px 14px rgba(0,0,0,.1)}
#zoom.hide{display:none}
#zoom button{border:0;background:none;font-family:inherit;cursor:pointer;color:var(--ink-2);
  border-right:1px solid var(--line-2)}
#zoom button:last-child{border-right:0}
#zoom button:hover{background:var(--line-2);color:var(--ink)}
#zOut,#zIn{width:36px;height:36px;font-size:18px;font-weight:600;line-height:1}
#zLvl{padding:0 9px;font-size:11px;font-weight:800;min-width:50px;
  font-variant-numeric:tabular-nums;color:var(--ink-3)}

#ghost{position:fixed;z-index:60;pointer-events:none;background:var(--card);
  border:2px solid var(--drop);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;transform:translate(-50%,-50%);white-space:nowrap}
#ghost.on{opacity:1}
#ghost small{display:block;font-size:9px;font-weight:600;color:var(--drop);margin-top:1px}

#list{padding:10px 8px 90px;max-width:680px;margin:0 auto}
.row{display:flex;align-items:center;gap:6px;height:34px;border-radius:7px;
  cursor:grab;position:relative;touch-action:pan-y;user-select:none}
.row:hover{background:var(--line-2)}
.row.sel{background:var(--seal-soft);box-shadow:inset 0 0 0 1px var(--seal)}
.row.dragging{opacity:.35}
.row.dropok{background:var(--drop-soft);box-shadow:inset 0 0 0 2px var(--drop)}
.row.dropbad{opacity:.4;box-shadow:inset 0 0 0 1px var(--seal)}
.tw{width:16px;height:16px;flex:none;display:grid;place-items:center;
  border-radius:4px;color:var(--ink-3);font-size:9px;cursor:pointer;z-index:2}
.tw:hover{background:var(--line);color:var(--ink)}
.tw.leaf{visibility:hidden}
.tw svg{transition:transform .15s;pointer-events:none}
.row.closed .tw svg{transform:rotate(-90deg)}
.ico{width:15px;flex:none;color:var(--ink-3);display:grid;place-items:center;pointer-events:none}
.row .rn{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;pointer-events:none}
.row.unknown .rn{color:var(--ink-3);font-style:italic}
.row.me .rn{font-weight:800}
.row .rg{font-size:10px;color:var(--ink-3);font-weight:700;flex:none;pointer-events:none}
.row .rc{font-size:10px;font-weight:800;color:#fff;background:var(--seal);
  padding:1px 5px;border-radius:20px;flex:none;pointer-events:none}
.row.me .rc{background:var(--gold)}
.row .rt{font-size:10px;flex:none;pointer-events:none}
.row .rsp{flex:1;pointer-events:none}
.kidcount{font-size:10px;color:var(--ink-3);flex:none;padding-right:6px;pointer-events:none;
  font-variant-numeric:tabular-nums;font-weight:700}
.kidcount em{font-style:normal;font-weight:600;opacity:.62}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2);pointer-events:none}

#panel{position:fixed;z-index:40;background:var(--card);border-left:1px solid var(--line);
  right:0;top:52px;bottom:0;width:320px;transform:translateX(100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#panel.open{transform:none}
.ph{padding:16px 16px 12px;border-bottom:1px solid var(--line-2);position:relative}
.ph .gen{font-size:10px;font-weight:800;color:var(--seal);letter-spacing:.08em}
.ph h2{font-size:24px;font-weight:800;letter-spacing:-.04em;margin-top:3px}
.ph .rel{font-size:12px;color:var(--ink-2);margin-top:5px}
.ph .rel b{color:var(--seal)}
.close{position:absolute;top:12px;right:12px;border:0;background:none;font-size:19px;
  color:var(--ink-3);cursor:pointer;line-height:1;padding:4px}
.pb{flex:1;overflow-y:auto;padding:14px 16px 20px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:6px;
  padding:8px 9px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--paper)}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--ink);background:#fff}
.fld textarea{resize:vertical;min-height:52px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);padding:7px 0;font-size:11px;font-weight:600;
  color:var(--ink-2);cursor:pointer;font-family:inherit;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on[data-v="unknown"]{background:var(--ink-3);color:#fff}
.seg button.on[data-v="guess"]{background:var(--gold);color:#fff}
.seg button.on[data-v="sure"]{background:var(--seal);color:#fff}
.tel{display:flex;gap:6px}
.tel input{flex:1}
.telbtn{border:1px solid var(--line);background:var(--paper);border-radius:6px;width:36px;
  display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:14px}
.telbtn:hover{background:var(--seal-soft);border-color:var(--seal)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.acts .btn{flex:1;min-width:74px}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:14px 0}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--ink-2);gap:12px}
.kv b{color:var(--ink);font-weight:600;text-align:right}

body.readonly .acts,
body.readonly #dbAdd,
body.readonly #mEdit,
body.readonly #mReset,
body.readonly #dbSave{display:none}
body.readonly #pBody input,
body.readonly #pBody textarea,
body.readonly #pBody select{pointer-events:none;background:var(--line-2);color:var(--ink-2)}
body.readonly .node,body.readonly .row{cursor:pointer}
.mode{font-size:10px;font-weight:800;color:var(--ink-3);background:var(--line-2);
  padding:4px 8px;border-radius:20px;letter-spacing:.03em;flex:none;white-space:nowrap}
.mode.edit{background:var(--seal);color:#fff}
#authmodal{position:fixed;inset:0;z-index:95;background:rgba(26,29,33,.5);
  display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}
#authmodal[hidden]{display:none}
.authbox{background:var(--card);border-radius:13px;padding:22px;width:100%;max-width:310px;
  box-shadow:0 20px 60px rgba(0,0,0,.32);border:1px solid var(--line);text-align:center}
.aseal{width:44px;height:44px;margin:0 auto 13px;border-radius:9px;background:var(--seal);
  color:#fff;font-size:22px;font-weight:800;display:grid;place-items:center}
.authbox h3{font-size:16px;font-weight:800;letter-spacing:-.03em}
.asub{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.6}
.authbox label{display:block;text-align:left;font-size:10px;font-weight:700;
  color:var(--ink-3);letter-spacing:.05em;margin:14px 0 5px}
.authbox input{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 11px;
  font-size:16px;font-family:inherit;background:var(--paper);color:var(--ink)}
.authbox input:focus{outline:none;border-color:var(--ink);background:#fff}
.kakao{width:100%;height:42px;border:0;border-radius:7px;background:#FEE500;color:#191600;
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:16px;
  display:flex;align-items:center;justify-content:center;gap:7px}
.kakao:hover{background:#f5dc00}
.kakao:disabled{opacity:.5;cursor:not-allowed}
.ordiv{display:flex;align-items:center;gap:9px;margin:15px 0 2px}
.ordiv::before,.ordiv::after{content:'';flex:1;height:1px;background:var(--line)}
.ordiv span{font-size:10px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.aerr{font-size:11px;color:var(--seal);font-weight:700;min-height:15px;margin-top:8px;text-align:left}
.arow{display:flex;gap:7px;margin-top:14px}
.arow .btn{flex:1;height:40px;font-size:13px}
.btn.asubmit{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.asubmit:hover{background:#000;color:#fff}
.btn.asubmit:disabled{opacity:.5}
#syncbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:55;
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:7px 13px;
  border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap}
#syncbar[hidden]{display:none}
#syncbar.err{background:var(--seal)}

#edmodal{position:fixed;inset:0;z-index:92;background:rgba(26,29,33,.5);
  display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#edmodal[hidden]{display:none}
.edbox{background:var(--card);border-radius:13px;width:100%;max-width:560px;
  max-height:min(80vh,620px);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.35);border:1px solid var(--line)}
#edtable{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
#edtable th{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:8px 10px;text-align:left;font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.04em}
#edtable td{border-bottom:1px solid var(--line-2);padding:9px 10px;vertical-align:middle}
#edtable .who{font-weight:700}
#edtable .prov{font-size:10px;color:var(--ink-3);font-weight:600}
#edtable .rolechip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;
  background:var(--line-2);color:var(--ink-2)}
#edtable .rolechip.admin{background:var(--seal);color:#fff}
#edtable .act button{border:1px solid var(--line);background:var(--card);border-radius:6px;
  padding:5px 9px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink-2)}
#edtable .act button:hover{border-color:var(--ink);color:var(--ink)}
#edtable .act button.rm:hover{border-color:var(--seal);color:var(--seal)}
#edtable tr.me td{background:#fbf7f0}
.edhint{padding:13px;margin:11px;border:1px dashed var(--line);border-radius:8px;background:var(--paper)}
.edhint b{display:block;font-size:11px;font-weight:800;margin-bottom:4px}
.edhint span{font-size:11px;color:var(--ink-2);line-height:1.6}
@media(max-width:768px){.edbox{max-height:90vh}}

#dbmodal{position:fixed;inset:0;z-index:90;background:rgba(26,29,33,.5);
  display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#dbmodal[hidden]{display:none}
.dbbox{background:var(--card);border-radius:13px;width:100%;max-width:860px;
  height:min(84vh,700px);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.35);border:1px solid var(--line)}
.dbhd{display:flex;align-items:flex-start;justify-content:space-between;
  padding:15px 16px 12px;border-bottom:1px solid var(--line-2);flex:none}
.dbhd h3{font-size:16px;font-weight:800;letter-spacing:-.03em}
.dbhd p{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.dbhd .close{position:static;padding:2px 6px}
.dbwrap{flex:1;overflow:auto;padding:0}
#dbtable{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
#dbtable th{position:sticky;top:0;z-index:2;background:var(--paper);
  border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;
  font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
#dbtable td{border-bottom:1px solid var(--line-2);padding:0}
#dbtable input,#dbtable select{width:100%;border:0;background:none;padding:7px 6px;
  font-family:inherit;font-size:12px;color:var(--ink);min-width:0}
#dbtable input:focus,#dbtable select:focus{outline:2px solid var(--ink);outline-offset:-2px;background:#fff}
#dbtable tr.err td{background:#fdeceb}
#dbtable tr.err input{color:var(--seal)}
#dbtable td.rm{width:26px;text-align:center}
#dbtable td.rm button{border:0;background:none;color:var(--ink-3);cursor:pointer;
  font-size:14px;padding:4px 6px;line-height:1}
#dbtable td.rm button:hover{color:var(--seal)}
#dbtable td.idc{font-size:10px;color:var(--ink-3);padding:0 6px;font-variant-numeric:tabular-nums}
.dbft{display:flex;align-items:center;gap:7px;padding:11px 14px;
  border-top:1px solid var(--line-2);flex:none;background:var(--paper)}
.dbmsg{flex:1;font-size:11.5px;font-weight:600;color:var(--seal);min-height:15px}
.dbmsg.ok{color:var(--ink-3)}
.btn.dbsave{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dbsave:hover{background:#000;color:#fff}
.btn.dbsave:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:768px){
  .dbbox{height:92vh;max-width:none}
  #dbtable{font-size:11px}
  #dbtable input,#dbtable select{font-size:16px;padding:8px 5px}
}

#savewarn{position:fixed;left:12px;right:12px;bottom:12px;z-index:80;
  background:var(--seal);color:#fff;border-radius:10px;padding:12px 14px;
  box-shadow:0 8px 30px rgba(140,47,42,.4);max-width:520px;margin:0 auto;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#savewarn b{font-size:13px;font-weight:800;flex:none;width:100%}
#savewarn span{font-size:11.5px;line-height:1.5;opacity:.92;flex:1 1 100%}
#savewarn button{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);
  color:#fff;font-family:inherit;font-size:11.5px;font-weight:700;
  padding:6px 11px;border-radius:6px;cursor:pointer}
#savewarn button:hover{background:rgba(255,255,255,.26)}
#savewarn #swExport{background:#fff;color:var(--seal);border-color:#fff}

#bmenu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:5px;min-width:172px}
#bmenu[hidden]{display:none}
#bmenu button{display:block;width:100%;text-align:left;border:0;background:none;
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
  padding:8px 10px;border-radius:6px;cursor:pointer}
#bmenu button:hover{background:var(--line-2)}
#bmenu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
#bmenu small{display:block;padding:5px 10px 7px;font-size:10px;color:var(--ink-3);line-height:1.5}

.infohd{font-size:10px;font-weight:800;color:var(--seal);letter-spacing:.08em;margin-bottom:10px}
.bignum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.bn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 4px;text-align:center}
.bn b{display:block;font-size:20px;font-weight:800;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums}
.bn span{display:block;font-size:9px;color:var(--ink-3);margin-top:4px;font-weight:600}
.glabel{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;margin-bottom:6px}
.glabel.mt{margin-top:15px}
.gsec{margin-bottom:4px}
.gbars{display:flex;gap:4px;align-items:flex-end}
.gbar{flex:1;text-align:center}
.gb{height:38px;display:flex;align-items:flex-end;background:var(--line-2);border-radius:3px;overflow:hidden}
.gb i{display:block;width:100%;background:var(--seal);border-radius:3px 3px 0 0;min-height:3px}
.gv{font-size:10px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.gg{font-size:8.5px;color:var(--ink-3);font-weight:700}
.warn{font-size:11px;color:var(--ink-2);background:#fdf6e8;border:1px solid #ecdcb8;
  border-radius:6px;padding:6px 8px;margin-top:8px}
.warn b{color:var(--gold)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.pchip{font-size:11px;font-weight:600;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;padding:3px 6px;cursor:pointer;white-space:nowrap}
.pchip:hover{border-color:var(--ink);background:#fff}
.pchip em{font-style:normal;font-size:8.5px;color:var(--ink-3);margin-left:3px;font-weight:700}
.pchip.cur{background:var(--seal);border-color:var(--seal);color:#fff}
.pchip.cur em{color:#e8bfbc}
.parrow{color:var(--ink-3);font-size:11px}
.kv i{font-style:normal;font-size:10px;color:var(--ink-3);font-weight:600}
a.go{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);
  text-underline-offset:2px;cursor:pointer}
a.go:hover{color:var(--seal);text-decoration-color:var(--seal)}
.ok8{color:var(--seal);font-weight:700}
.no8{color:var(--ink-3);font-weight:700}

#ask{position:fixed;inset:0;z-index:70;background:rgba(26,29,33,.42);
  display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px)}
#ask[hidden]{display:none}
.askbox{background:var(--card);border-radius:13px;padding:20px;max-width:330px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.askbox h3{font-size:16px;font-weight:800;letter-spacing:-.02em}
.askbox p{font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.55}
.askrow{display:flex;gap:8px;margin-top:17px}
.askrow .btn{flex:1;height:38px;font-size:13px}
.btn.askdel{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.askdel:hover{background:#71241f;border-color:#71241f;color:#fff}
#hint .undo{margin-left:10px;background:none;border:0;color:#ffb9b3;font-weight:800;
  font-size:11.5px;cursor:pointer;font-family:inherit;text-decoration:underline;padding:0}
#hint.act{pointer-events:auto}

#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:8px 14px;
  border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#hint.show{opacity:1}

/* 바텀시트 드래그 핸들 — 데스크탑에선 숨김 */
.grab{display:none}

/* ══════════ 모바일 ══════════ */
@media(max-width:768px){
  header{height:50px;padding:0 8px;gap:6px}
  .hstat{display:none}
  .brand b{font-size:13.5px}
  .brand span{display:none}          /* 한자 부제만 생략, 이름은 유지 */
  .viewseg{height:32px}
  .viewseg button{padding:0 13px;font-size:12.5px}
  .btn{height:32px;padding:0 10px;font-size:12px}
  #bFit{display:none}                    /* 줌 컨트롤과 중복 */
  #bSave{padding:0 8px}

  /* 세로식: 손가락에 맞게 키우고 들여쓰기 축소 */
  #list{padding:6px 4px 96px}
  .row{height:44px;gap:5px}
  .tw{width:30px;height:30px;margin-left:-7px}
  .tw svg{width:11px;height:11px}
  .ico{display:none}                     /* 좁은 화면에선 아이콘 생략 */
  .row .rn{font-size:15px}
  .row .rg{font-size:10.5px}
  .row .rc{font-size:10.5px;padding:2px 6px}
  .kidcount{font-size:10.5px}

  /* 바텀시트 */
  #panel{width:100%;top:auto;bottom:0;height:min(78vh,640px);
    border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;transform:translateY(100%);
    box-shadow:0 -8px 32px rgba(0,0,0,.16);
    transition:transform .26s cubic-bezier(.32,.72,0,1)}
  #panel.open{transform:none}
  #panel.dragging{transition:none}
  .grab{display:block;padding:8px 0 2px;cursor:grab;touch-action:none;flex:none}
  .grab i{display:block;width:36px;height:4px;border-radius:99px;
    background:var(--line);margin:0 auto}
  .ph{padding:8px 16px 12px}
  .ph h2{font-size:22px}
  .close{top:6px;right:10px;font-size:22px;padding:8px}
  .pb{padding:14px 16px calc(24px + env(safe-area-inset-bottom))}

  /* 입력 폼: iOS 자동확대 방지 위해 16px */
  .fld input,.fld textarea,.fld select{font-size:16px;padding:10px}
  .telbtn{width:46px;font-size:17px}
  .acts .btn{height:40px;font-size:13px;min-width:0;flex:1 1 calc(50% - 3px)}

  /* 관련 정보 */
  .bn b{font-size:22px}
  .gb{height:44px}
  .pchip{font-size:12px;padding:5px 8px}
  .kv{padding:7px 0;font-size:12.5px}

  #zoom{bottom:auto;top:58px;right:8px;flex-direction:column}
  #zOut,#zIn{width:40px;height:40px;font-size:20px}
  #zLvl{height:30px;font-size:10px;min-width:40px;padding:0 4px}
  #zoom button{border-right:0;border-bottom:1px solid var(--line-2)}
  #zoom button:last-child{border-bottom:0}

  #hint{bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px}
  .askbox{padding:18px}
  .askrow .btn{height:44px;font-size:14px}
}

/* 아주 좁은 화면 */
@media(max-width:360px){
  .viewseg button{padding:0 10px}
  .btn{padding:0 8px;font-size:11.5px}
  .row{gap:4px}
  .bignum{gap:5px}
  .bn{padding:8px 2px}
  .bn b{font-size:19px}
  .bn span{font-size:8.5px}
}

/* 가로 눕힘 — 세로 공간 부족 */
@media(max-height:480px) and (orientation:landscape){
  #panel{height:92vh}
  .grab{padding:5px 0 1px}
}

<header>

</div>

  <hr>

  <hr>

  <button id="mPull">서버에서 새로고침</button>
  <hr>

const KEY='jokbo.v2';
const isMob=()=>(typeof matchMedia==='function'
  ? matchMedia('(max-width:768px)').matches
  : innerWidth<=768);
let P,meId=null,uid=70,view=null,closed={};
function load(){
  try{const r=localStorage.getItem(KEY);
    if(r){const d=JSON.parse(r);P=d.people;meId=d.meId||null;uid=d.uid||70;
      view=d.view||null;closed=d.closed||{};

/* ══ 촌수 엔진 ══ */
function chain(id){const a=[];let c=id,g=0;while(c&&M[c]&&g<60){a.push(c);c=M[c].f;g++}return a}
function chon(a,b){
  if(!a||!b||!M[a]||!M[b])return null;
  if(a===b)return{n:0,up:0,down:0};
  const pa=chain(a),pb=chain(b);
  for(let i=0;i<pa.length;i++){const j=pb.indexOf(pa[i]);
    if(j>=0)return{n:i+j,up:i,down:j,lca:pa[i]}}
  return null;
}
function callName(r){
  if(!r)return null;
  const{n,up,down}=r;
  if(n===0)return'본인';
  if(down===0)return['','아버지','할아버지','증조할아버지','고조할아버지','5대조','6대조','7대조'][up]||(up+'대조');
  if(up===0)return['','아들','손자','증손자','고손자','5대손','6대손','7대손'][down]||(down+'대손');
  if(up===1&&down===1)return'형제';
  if(up===1&&down===2)return'조카';
  if(up===2&&down===1)return'삼촌(백숙부)';
  if(up===2&&down===2)return'사촌';
  if(up===2&&down===3)return'오촌 조카';
  if(up===3&&down===2)return'오촌 당숙';
  if(up===3&&down===3)return'육촌';
  if(up===3&&down===4)return'칠촌 조카';
  if(up===4&&down===3)return'칠촌 재당숙';
  if(up===4&&down===4)return'팔촌';
  if(up>down)return n+'촌 (윗세대)';
  if(up<down)return n+'촌 (아랫세대)';
  return n+'촌';
}
function hangryeol(a,b){
  const ga=M[a].gen,gb=M[b].gen;
  if(ga===gb)return'같은 항렬';
  return gb<ga?(ga-gb)+'세대 위':(gb-ga)+'세대 아래';
}
function relText(id){
  if(!meId||!M[meId])return null;
  if(id===meId)return{call:'본인',n:0,h:''};
  const r=chon(meId,id);
  if(!r)return{call:'연결 없음',n:null,h:''};
  return{call:callName(r),n:r.n,h:hangryeol(meId,id)};
}

function kids(id){return P.filter(p=>p.f===id).sort((a,b)=>{
  const oa=parseInt(a.ord)||999,ob=parseInt(b.ord)||999;
  if(oa!==ob)return oa-ob;
  return P.indexOf(a)-P.indexOf(b);
})}
function roots(){return P.filter(p=>!p.f||!M[p.f])}
function isDesc(anc,id){let c=id,g=0;while(c&&g<80){if(c===anc)return true;c=M[c]&&M[c].f;g++}return false}
function reparent(childId,newFid){
  if(childId===newFid)return;
  if(isDesc(childId,newFid)){toast('자기 자손 아래로는 옮길 수 없습니다');return}
  const c=M[childId];
  if(c.f===newFid){toast('이미 그 아래입니다');return}
  const shift=(M[newFid].gen+1)-c.gen;
  c.f=newFid;
  if(shift!==0){const st=[childId];
    while(st.length){const x=st.pop();M[x].gen+=shift;kids(x).forEach(k=>st.push(k.id))}}
  closed[newFid]=false;
  save();queuePush(childId);draw();
  toast(`${c.name||'미상'} → ${M[newFid].name||'미상'}의 자녀로`);
}

const NW=54,NH=38,GAPX=10,GAPY=64,PAD=64;
let pos={},W=0,H=0,scale=1,cur2=null;
function layoutH(){
  pos={};let c=0;
  const gens=[...new Set(P.map(p=>p.gen))].sort((a,b)=>a-b),g0=gens[0];
  function walk(id){
    const ch=kids(id);
    if(!ch.length){const x=c;c+=NW+GAPX;pos[id]={x,y:(M[id].gen-g0)*GAPY};return x}
    const xs=ch.map(k=>walk(k.id));
    const x=(Math.min(...xs)+Math.max(...xs))/2;
    pos[id]={x,y:(M[id].gen-g0)*GAPY};return x;
  }
  roots().forEach(r=>{walk(r.id);c+=GAPX*2});
  W=c+PAD;H=(gens[gens.length-1]-g0)*GAPY+NH+PAD;
}
function renderH(){
  world.hidden=false;listEl.hidden=true;stage.className='pan';
  listEl.innerHTML='';

  wires.setAttribute('width',W);wires.setAttribute('height',H);
  world.querySelectorAll('.node,.genband').forEach(n=>n.remove());

  gens.forEach(g=>{

    b.innerHTML=`<span>${g}대</span>`;world.appendChild(b);
  });
  let d='';
  P.forEach(p=>{
    if(!p.f||!pos[p.f]||!pos[p.id])return;
    const a=pos[p.f],b=pos[p.id];
    const x1=a.x+NW/2,y1=a.y+NH,x2=b.x+NW/2,y2=b.y,my=y1+(y2-y1)/2;
    d+=`M${x1} ${y1} V${my} H${x2} V${y2} `;
  });

  P.forEach(p=>{
    const q=pos[p.id];if(!q)return;
    const el=document.createElement('div');
    el.className='node'+(!p.name?' unknown':'')+(p.id===meId?' me':'')+(p.id===cur2?' sel':'');
    el.style.cssText=`left:${q.x}px;top:${q.y}px;--nw:${NW}px;--nh:${NH}px`;
    el.dataset.id=p.id;

    el.innerHTML=`<div class="nm">${p.name||(p.ord||'?')}</div>`+
      (p.birth?`<div class="sub">${p.birth}</div>`:(!p.name&&p.ord?'<div class="sub">서열</div>':''))+
      (p.tel?'<div class="dot"></div>':'')+

      (p.id===meId?'<div class="chip">나</div>':(rel&&rel.n>0?`<div class="chip">${rel.n}촌</div>`:''));
    world.appendChild(el);
  });
  stat();
}
const ZMIN=.2,ZMAX=2.6;
function applyZoom(){
  world.style.transform=`scale(${scale})`;
  const z=document.getElementById('zLvl');

}
/* 화면상의 한 점(cx,cy)을 고정한 채 확대축소 */
function zoomAt(next,cx,cy){
  next=Math.min(ZMAX,Math.max(ZMIN,next));
  if(Math.abs(next-scale)<.0005)return;
  const r=stage.getBoundingClientRect();
  const px=(stage.scrollLeft+(cx-r.left))/scale;
  const py=(stage.scrollTop +(cy-r.top ))/scale;
  scale=next;applyZoom();
  stage.scrollLeft=px*scale-(cx-r.left);
  stage.scrollTop =py*scale-(cy-r.top );
}
function zoomCenter(next){
  const r=stage.getBoundingClientRect();
  zoomAt(next,r.left+r.width/2,r.top+r.height/2);
}
function fit(){
  if(view!=='h')return;
  const sw=stage.clientWidth-24,sh=stage.clientHeight-24;
  scale=Math.max(Math.min(sw/W,sh/H,1.4),ZMIN);
  applyZoom();
  stage.scrollLeft=0;stage.scrollTop=0;
}

  if(e.key==='-'||e.key==='_'){e.preventDefault();zoomCenter(scale/1.25)}
  if(e.key==='0'){e.preventDefault();zoomCenter(1)}

});

/* ══ 드래그 = 부모 변경 ══ */
let dg=null,moved=false,holdT=null,armed=true;
stage.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.node,.row');
  if(!el)return;
  if(e.target.closest('[data-tw]'))return;
  dg={id:el.dataset.id,el,sx:e.clientX,sy:e.clientY,over:null,touch:e.pointerType==='touch'};
  moved=false;
  /* 터치에서는 길게 눌러야 드래그 시작 — 그래야 목록 스크롤이 살아있음 */
  armed=!dg.touch;
  if(dg.touch){
    clearTimeout(holdT);
    holdT=setTimeout(()=>{
      if(!dg)return;
      armed=true;
      if(navigator.vibrate)navigator.vibrate(12);
      dg.el.classList.add('dragging');
      const p=M[dg.id];
      ghost.innerHTML=`${p.name||(p.ord||'?')}<small>옮길 부모 위에 놓기</small>`;
      ghost.classList.add('on');
      ghost.style.left=dg.sx+'px';ghost.style.top=(dg.sy-40)+'px';
      moved=true;
    },420);
  }
});
addEventListener('pointermove',e=>{
  if(!dg)return;
  const far=Math.hypot(e.clientX-dg.sx,e.clientY-dg.sy)>=8;
  if(dg.touch&&!armed){                 // 길게누르기 전에 움직이면 = 스크롤 의도
    if(far){clearTimeout(holdT);dg=null}
    return;
  }
  if(!moved&&!far)return;
  if(!moved){
    moved=true;dg.el.classList.add('dragging');
    const p=M[dg.id];
    ghost.innerHTML=`${p.name||(p.ord||'?')}<small>옮길 부모 위에 놓기</small>`;
    ghost.classList.add('on');document.body.style.userSelect='none';
  }
  if(dg.touch)e.preventDefault();
  ghost.style.left=e.clientX+'px';ghost.style.top=(e.clientY-40)+'px';
  const u=document.elementsFromPoint(e.clientX,e.clientY)
    .find(n=>n.matches&&n.matches('.node,.row')&&n.dataset.id&&n.dataset.id!==dg.id);
  if(dg.over&&dg.over!==u)dg.over.classList.remove('dropok','dropbad');
  dg.over=u||null;
  if(u)u.classList.add(isDesc(dg.id,u.dataset.id)?'dropbad':'dropok');
},{passive:false});
addEventListener('pointerup',()=>{
  clearTimeout(holdT);
  if(!dg)return;
  const wm=moved&&armed,over=dg.over,id=dg.id;
  ghost.classList.remove('on');document.body.style.userSelect='';
  dg.el.classList.remove('dragging');
  if(over)over.classList.remove('dropok','dropbad');
  dg=null;
  if(wm&&over)reparent(id,over.dataset.id);
  else if(!moved)openPanel(id);
  setTimeout(()=>{moved=false},0);
});
addEventListener('pointercancel',()=>{
  clearTimeout(holdT);
  if(!dg)return;
  ghost.classList.remove('on');dg.el.classList.remove('dragging');
  if(dg.over)dg.over.classList.remove('dropok','dropbad');
  dg=null;moved=false;
});

let pt=new Map(),pinch=null;
stage.addEventListener('pointerdown',e=>{

},{capture:true});

  const[a,b]=[...pt.values()];
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);

    });
    h+=`</div></div>`;
    if(s.unk>0)h+=`<div class="warn">자손 중 <b>${s.unk}명</b>이 이름 미상입니다</div>`;
  }

  /* 직계 계보 */
  h+=`<div class="glabel mt">직계 계보 (최상단 → 본인)</div><div class="path">`;
  path.forEach((x,i)=>{
    h+=`<span class="pchip${x.id===id?' cur':''}" data-go="${x.id}">${x.name}<em>${x.gen}</em></span>`;
    if(i<path.length-1)h+='<span class="parrow">›</span>';
  });
  h+=`</div>`;

  /* 가족 */
  h+=`<div class="glabel mt">가족</div>`;
  h+=`<div class="kv"><span>아버지</span><b>${p.f?`<a class="go" data-go="${p.f}">${nm(p.f)}</a> <i>${M[p.f].gen}대</i>`:'— (최상단)'}</b></div>`;
  h+=`<div class="kv"><span>형제</span><b>${sb.length?sb.map(x=>`<a class="go" data-go="${x.id}">${nm(x.id)}</a>`).join(', '):'없음'}${si&&si.n>1?` <i>${si.n}남 중 ${si.i}째</i>`:''}</b></div>`;
  h+=`<div class="kv"><span>자녀</span><b>${ch.length?ch.map(x=>`<a class="go" data-go="${x.id}">${nm(x.id)}</a>`).join(', '):'없음'}</b></div>`;

  /* 나와의 관계 상세 */
  if(meId&&M[meId]&&id!==meId){
    const r=chon(meId,id);
    if(r){
      h+=`<div class="glabel mt">나와의 관계</div>`;
      h+=`<div class="kv"><span>촌수</span><b>${r.n}촌 · ${callName(r)}</b></div>`;
      h+=`<div class="kv"><span>항렬</span><b>${hangryeol(meId,id)}</b></div>`;
      h+=`<div class="kv"><span>공통 조상</span><b><a class="go" data-go="${r.lca}">${nm(r.lca)}</a> <i>${M[r.lca].gen}대</i></b></div>`;
      h+=`<div class="kv"><span>경로</span><b><i>나에서 ${r.up}단계 위 → ${r.down}단계 아래</i></b></div>`;
      h+=`<div class="kv"><span>친족 범위</span><b>${r.n<=8?`<span class="ok8">법적 친족 (8촌 이내)</span>`:`<span class="no8">8촌 밖</span>`}</b></div>`;
    }
  }
  return h;
}
function subtree(id){
  let total=0,named=0,unk=0,leaves=0,maxg=M[id].gen;
  const perGen={};
  const st=[id];
  while(st.length){
    const x=st.pop(),ch=kids(x);
    if(x!==id){
      total++; M[x].name?named++:unk++;
      perGen[M[x].gen]=(perGen[M[x].gen]||0)+1;
      if(M[x].gen>maxg)maxg=M[x].gen;
      if(!ch.length)leaves++;
    }
    ch.forEach(k=>st.push(k.id));
  }
  return{total,named,unk,leaves,depth:maxg-M[id].gen,perGen};
}
function nm(id){const p=M[id];return p?(p.name||(p.ord?p.ord+'번째':'미상')):'—'}
function ancPath(id){         // 최상단 → 본인
  const a=chain(id).reverse();
  return a.map(x=>({id:x,name:nm(x),gen:M[x].gen}));
}
function sibsOf(id){
  const p=M[id];if(!p.f)return[];
  return kids(p.f).filter(k=>k.id!==id);
}
function sibIndex(id){
  const p=M[id];if(!p.f)return null;
  const s=kids(p.f);
  const i=s.findIndex(k=>k.id===id);
  return i<0?null:{i:i+1,n:s.length};
}

/* ══ 삭제 ══ */
let undo=null;
function doDelete(x){
  const px=M[x];if(!px)return;
  const ch=kids(x),nm=px.name||(px.ord?px.ord+'번째':'이름 미상');
  undo={people:JSON.parse(JSON.stringify(P)),meId,closed:{...closed}}; // 되돌리기 스냅샷
  const newF=px.f||null;
  ch.forEach(k=>{
    k.f=newF;
    const shift=(newF?M[newF].gen+1:k.gen)-k.gen;
    if(shift!==0){const st=[k.id];
      while(st.length){const y=st.pop();M[y].gen+=shift;kids(y).forEach(g=>st.push(g.id))}}
  });
  P=P.filter(y=>y.id!==x);
  if(meId===x)meId=null;
  delete closed[x];
  save();reindex();
  if(online()&&canEdit){ ch.forEach(k=>queuePush(k.id)); push(x) }
  closePanel();draw();
  toastUndo(`‘${nm}’ 삭제됨`+(ch.length?` · 자녀 ${ch.length}명 이동`:''));
}
function doUndo(){
  if(!undo)return;
  P=undo.people;meId=undo.meId;closed=undo.closed;undo=null;
  save();draw();toast('되돌렸습니다');
}

const SB_URL='';      // 예: https://abcdefgh.supabase.co

function syncMsg(m,isErr){

/* 서버에서 전체 불러오기 */
async function pull(){
  if(!online())return false;
  try{
    const {data,error}=await sb.from('people_public').select('*').order('gen');
    if(error)throw error;
    if(!data||!data.length){syncMsg('서버에 데이터가 없습니다 — 백업 메뉴에서 업로드하세요',true);return false}
    P=data.map(r=>{
      const o={id:r.id,gen:r.gen,conf:r.conf||'unknown'};
      if(r.name)o.name=r.name;
      if(r.ord)o.ord=r.ord;
      if(r.father_id)o.f=r.father_id;
      if(r.sex)o.sex=r.sex;
      if(r.birth)o.birth=r.birth;
      if(r.death)o.death=r.death;
      if(r.tel)o.tel=r.tel;
      if(r.note)o.note=r.note;
      return o;
    });
    reindex();
    return true;
  }catch(e){ syncMsg('불러오기 실패: '+(e.message||e),true); return false }
}
/* 한 사람 저장 */
async function push(id){
  if(!online()||!canEdit)return;
  const p=M[id];
  try{
    if(!p){ await sb.from('people').delete().eq('id',id); return }
    const row={id:p.id,gen:p.gen,name:p.name||null,ord:p.ord||null,
      father_id:p.f||null,sex:p.sex||null,birth:p.birth||null,death:p.death||null,
      tel:p.tel||null,note:p.note||null,conf:p.conf||'unknown'};
    const {error}=await sb.from('people').upsert(row);
    if(error)throw error;
  }catch(e){ syncMsg('저장 실패: '+(e.message||e),true) }
}
/* 전체 밀어넣기 (최초 1회) */
async function pushAll(){
  if(!online()){syncMsg('Supabase 설정이 없습니다',true);return}
  if(!canEdit){syncMsg('로그인이 필요합니다',true);return}
  if(!confirm(`서버에 ${P.length}명을 올립니다.\n같은 ID가 있으면 덮어씁니다. 계속할까요?`))return;
  syncMsg('올리는 중…');
  try{
    // 부모 참조 때문에 세대 순으로
    const sorted=[...P].sort((a,b)=>a.gen-b.gen);
    const rows=sorted.map(p=>({id:p.id,gen:p.gen,name:p.name||null,ord:p.ord||null,
      father_id:p.f||null,sex:p.sex||null,birth:p.birth||null,death:p.death||null,
      tel:p.tel||null,note:p.note||null,conf:p.conf||'unknown'}));
    // 1차: 부모 없이 (FK 충돌 방지)
    const {error:e1}=await sb.from('people').upsert(rows.map(r=>({...r,father_id:null})));
    if(e1)throw e1;
    // 2차: 부모 연결
    for(const r of rows){
      if(!r.father_id)continue;
      const {error}=await sb.from('people').update({father_id:r.father_id}).eq('id',r.id);
      if(error)throw error;
    }
    syncMsg(`${rows.length}명 업로드 완료`);
  }catch(e){ syncMsg('업로드 실패: '+(e.message||e),true) }
}

});
async function checkEditor(){
  canEdit=false; isAdmin=false;
  if(!session)return;
  try{
    const {data}=await sb.from('editors').select('role').eq('user_id',session.user.id).maybeSingle();
    canEdit=!!data;
    isAdmin=!!(data&&data.role==='admin');
  }catch(e){}
}
async function initSB(){
  if(!online()){setMode();return false}
  try{
    const {data}=await sb.auth.getSession();
    session=data.session||null;
    await checkEditor();
    // OAuth(카카오)로 막 돌아온 경우 결과를 알려준다
    if(session&&justReturned()){
      if(canEdit)syncMsg('편집 가능합니다');
      else syncMsg('로그인됐지만 편집 권한이 없습니다 — 관리자에게 등록을 요청하세요',true);
    }
  }catch(e){}
  setMode();
  return await pull();
}
function justReturned(){
  const h=location.hash||'';
  if(/access_token|error=/.test(h)){
    history.replaceState(null,'',location.pathname+location.search);
    return true;
  }
  return false;
}

/* ══ 편집자 관리 ══ */
const edm=document.getElementById('edmodal');
let isAdmin=false;
async function openEditors(){
  if(!online()){syncMsg('Supabase 설정이 없습니다',true);return}
  if(!session){syncMsg('로그인이 필요합니다',true);return}
  edm.hidden=false;
  await loadEditors();
}
async function loadEditors(){
  const t=document.getElementById('edtable'), m=document.getElementById('edmsg');
  t.innerHTML='<tbody><tr><td style="padding:16px;color:#9aa2ab">불러오는 중…</td></tr></tbody>';
  try{
    const {data,error}=await sb.rpc('list_accounts');
    if(error)throw error;
    if(!data||!data.length){
      t.innerHTML='<tbody><tr><td style="padding:16px;color:#9aa2ab">관리자만 볼 수 있습니다.</td></tr></tbody>';
      m.textContent=''; return;
    }
    let html='<thead><tr><th>이름</th><th>로그인</th><th>권한</th><th style="text-align:right">동작</th></tr></thead><tbody>';
    data.forEach(u=>{
      const me=session&&u.user_id===session.user.id;
      const admin=u.role==='admin';
      html+=`<tr class="${me?'me':''}">
        <td class="who">${u.display}${me?' <span class="prov">(나)</span>':''}</td>
        <td class="prov">${u.provider==='kakao'?'카카오':'이메일'}</td>
        <td>${u.is_editor?`<span class="rolechip ${admin?'admin':''}">${admin?'관리자':'편집자'}</span>`:'<span class="prov">보기만</span>'}</td>
        <td class="act" style="text-align:right">${
          admin ? '<span class="prov">—</span>'
          : u.is_editor
            ? `<button class="rm" data-off="${u.user_id}">권한 제거</button>`
            : `<button data-on="${u.user_id}" data-nm="${u.display}">편집자로</button>`}</td>
      </tr>`;
    });
    t.innerHTML=html+'</tbody>';
    const n=data.filter(u=>u.is_editor).length;
    m.textContent=`계정 ${data.length}명 · 편집자 ${n}명`;
  }catch(e){
    t.innerHTML=`<tbody><tr><td style="padding:16px;color:#8c2f2a">${e.message||e}</td></tr></tbody>`;
  }
}
document.getElementById('edtable').addEventListener('click',async e=>{
  const on=e.target.closest('[data-on]'), off=e.target.closest('[data-off]');
  if(!on&&!off)return;
  const id=on?on.dataset.on:off.dataset.off;
  if(off&&!confirm('이 사람의 편집 권한을 제거할까요?'))return;
  try{
    const {error}=await sb.rpc('set_editor',{target:id,make_editor:!!on,lbl:on?on.dataset.nm:null});
    if(error)throw error;
    await loadEditors();
    syncMsg(on?'편집자로 추가했습니다':'권한을 제거했습니다');
  }catch(ex){ syncMsg(ex.message||'변경 실패',true) }
});
document.getElementById('edClose').onclick=()=>{edm.hidden=true};
document.getElementById('edRefresh').onclick=loadEditors;
edm.onclick=e=>{if(e.target===edm)edm.hidden=true};

/* ══ 데이터 직접 편집 ══ */
const dbm=document.getElementById('dbmodal'),dbt=document.getElementById('dbtable'),
      dbmsg=document.getElementById('dbmsg'),dbSaveBtn=document.getElementById('dbSave');
let draft=[];
const COLS=[
  {k:'id',   t:'id',   w:'62px',  label:'ID'},
  {k:'gen',  t:'num',  w:'52px',  label:'대'},
  {k:'name', t:'text', w:'88px',  label:'이름'},
  {k:'ord',  t:'text', w:'44px',  label:'서열'},
  {k:'f',    t:'text', w:'62px',  label:'아버지ID'},
  {k:'sex',  t:'sex',  w:'52px',  label:'성별'},
  {k:'birth',t:'text', w:'58px',  label:'출생'},
  {k:'death',t:'text', w:'58px',  label:'사망'},
  {k:'tel',  t:'text', w:'112px', label:'전화'},
  {k:'conf', t:'conf', w:'70px',  label:'신뢰도'},
  {k:'note', t:'text', w:'auto',  label:'메모·출처'},
];
function openDB(){
  draft=P.map(p=>({...p}));
  renderDB();
  dbm.hidden=false;
}
function renderDB(){
  let html='<thead><tr><th></th>';
  COLS.forEach(c=>html+=`<th style="width:${c.w}">${c.label}</th>`);
  html+='</tr></thead><tbody>';
  draft.forEach((r,i)=>{
    html+=`<tr data-i="${i}"><td class="rm"><button data-del="${i}" title="삭제">✕</button></td>`;
    COLS.forEach(c=>{
      const v=r[c.k]==null?'':r[c.k];
      if(c.k==='id'){html+=`<td class="idc">${v}</td>`;return}
      if(c.t==='sex'){
        html+=`<td><select data-i="${i}" data-k="sex">
          <option value=""${!v?' selected':''}>—</option>
          <option value="m"${v==='m'?' selected':''}>남</option>
          <option value="f"${v==='f'?' selected':''}>여</option></select></td>`;return}
      if(c.t==='conf'){
        html+=`<td><select data-i="${i}" data-k="conf">
          <option value="sure"${v==='sure'?' selected':''}>확실</option>
          <option value="guess"${v==='guess'?' selected':''}>추정</option>
          <option value="unknown"${v==='unknown'||!v?' selected':''}>미확인</option></select></td>`;return}
      html+=`<td><input data-i="${i}" data-k="${c.k}" value="${String(v).replace(/"/g,'&quot;')}"${c.t==='num'?' inputmode="numeric"':''}></td>`;
    });
    html+='</tr>';
  });
  dbt.innerHTML=html+'</tbody>';
  document.getElementById('dbinfo').textContent=
    `${draft.length}명 · 아버지ID를 바꾸면 트리 구조가 바뀝니다. 최상단은 아버지ID를 비워두세요.`;
  validate();
}
dbt.addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.k)return;
  const i=+el.dataset.i,k=el.dataset.k;
  let v=el.value.trim();
  if(k==='gen')draft[i][k]=v===''?'':(isNaN(+v)?v:+v);
  else draft[i][k]=v||undefined;
  validate();
});
dbt.addEventListener('change',e=>{
  const el=e.target; if(!el.dataset.k||el.tagName!=='SELECT')return;
  draft[+el.dataset.i][el.dataset.k]=el.value||undefined;
  validate();
});
dbt.addEventListener('click',e=>{
  const b=e.target.closest('[data-del]'); if(!b)return;
  const i=+b.dataset.del, id=draft[i].id;
  const ch=draft.filter(r=>r.f===id);
  if(ch.length && !confirm(`이 사람에게 자녀 ${ch.length}명이 있습니다.\n삭제하면 자녀의 아버지ID가 비워집니다. 계속할까요?`))return;
  ch.forEach(c=>c.f=undefined);
  draft.splice(i,1);
  renderDB();
});
document.getElementById('dbAdd').onclick=()=>{
  let n=uid;
  const ids=new Set(draft.map(r=>r.id));
  let nid; do{nid='p'+(++n)}while(ids.has(nid));
  draft.push({id:nid,gen:'',name:'',f:'',conf:'unknown'});
  renderDB();
  const wrap=dbt.closest('.dbwrap'); wrap.scrollTop=wrap.scrollHeight;
};
function validate(){
  const errs=[]; const ids=new Set(); const dup=new Set();
  draft.forEach(r=>{ if(ids.has(r.id))dup.add(r.id); ids.add(r.id) });
  if(dup.size)errs.push(`ID 중복: ${[...dup].join(', ')}`);
  const bad=[];
  draft.forEach(r=>{
    if(r.f && !ids.has(r.f))bad.push(`${r.id}의 아버지ID '${r.f}' 없음`);
    if(r.gen===''||r.gen==null||isNaN(+r.gen))bad.push(`${r.id}의 대(代)가 숫자가 아님`);
  });
  errs.push(...bad.slice(0,3));
  // 순환 검사
  const map=Object.fromEntries(draft.map(r=>[r.id,r]));
  for(const r of draft){
    let c=r.f,g=0,seen=new Set([r.id]);
    while(c&&g<200){ if(seen.has(c)){errs.push(`순환 참조: ${r.id}`);break} seen.add(c);c=map[c]&&map[c].f;g++ }
    if(errs.length>4)break;
  }
  // 행 표시
  [...dbt.querySelectorAll('tbody tr')].forEach(tr=>{
    const r=draft[+tr.dataset.i];
    const bad=!r||dup.has(r.id)||(r.f&&!ids.has(r.f))||r.gen===''||r.gen==null||isNaN(+r.gen);
    tr.classList.toggle('err',!!bad);
  });
  if(errs.length){dbmsg.textContent='⚠ '+errs.slice(0,2).join(' / ');dbmsg.className='dbmsg';dbSaveBtn.disabled=true}
  else{dbmsg.textContent=`${draft.length}명 · 이상 없음`;dbmsg.className='dbmsg ok';dbSaveBtn.disabled=false}
  return !errs.length;
}
dbSaveBtn.onclick=()=>{
  if(!validate())return;
  undo={people:JSON.parse(JSON.stringify(P)),meId,closed:{...closed}};
  P=draft.map(r=>{
    const o={...r, gen:+r.gen};
    Object.keys(o).forEach(k=>{ if(o[k]===''||o[k]==null)delete o[k] });
    o.id=r.id; o.gen=+r.gen;
    if(!o.conf)o.conf='unknown';
    return o;
  });
  if(meId&&!P.some(p=>p.id===meId))meId=null;
  const maxN=Math.max(70,...P.map(p=>+(String(p.id).replace(/\D/g,''))||0));
  uid=maxN;
  save();draw();
  dbm.hidden=true;
  toastUndo(`${P.length}명으로 저장됨`);
};
document.getElementById('dbCancel').onclick=()=>{dbm.hidden=true};
document.getElementById('dbClose').onclick=()=>{dbm.hidden=true};
dbm.onclick=e=>{if(e.target===dbm)dbm.hidden=true};

/* ══ 백업 ══ */
const bmenu=document.getElementById('bmenu');
document.getElementById('bSave').onclick=e=>{
  if(!bmenu.hidden){bmenu.hidden=true;return}
  const r=e.currentTarget.getBoundingClientRect();
  bmenu.style.top=(r.bottom+6)+'px';
  bmenu.style.right=Math.max(8,innerWidth-r.right)+'px';
  const ok=save();
  document.getElementById('mEditors').hidden=!isAdmin;
  document.getElementById('mPush').hidden=!canEdit;
  document.getElementById('mPull').hidden=!online();
  document.getElementById('mStat').textContent=
    ok ? `${P.length}명 · 이 브라우저에 저장됨` : '⚠ 저장 안 됨 — 파일로 내보내세요';
  bmenu.hidden=false;
};
document.getElementById('mEdit').onclick=()=>{bmenu.hidden=true;openDB()};
document.getElementById('mReset').onclick=()=>{
  bmenu.hidden=true;
  if(!confirm('입력한 내용이 모두 사라지고 처음 69명 데이터로 돌아갑니다.\n\n계속할까요?'))return;
  undo={people:JSON.parse(JSON.stringify(P)),meId,closed:{...closed}};
  P=SEED.map(p=>({...p}));meId=null;closed={};uid=70;
  save();draw();toastUndo('처음 데이터로 되돌렸습니다');
};
document.getElementById('mEditors').onclick=()=>{bmenu.hidden=true;openEditors()};
document.getElementById('mPush').onclick=()=>{bmenu.hidden=true;pushAll()};
document.getElementById('mPull').onclick=async()=>{bmenu.hidden=true;
  if(!online()){syncMsg('Supabase 설정이 없습니다',true);return}
  syncMsg('불러오는 중…'); if(await pull()){draw();syncMsg('서버와 동기화됨')}};
document.getElementById('mExport').onclick=()=>{bmenu.hidden=true;exportJSON()};
document.getElementById('mImport').onclick=()=>{bmenu.hidden=true;document.getElementById('fileIn').click()};
document.getElementById('fileIn').onchange=e=>{
  const f=e.target.files[0];
  if(f)importJSON(f);
  e.target.value='';
};
addEventListener('click',e=>{
  if(!bmenu.hidden&&!e.target.closest('#bmenu')&&e.target.id!=='bSave')bmenu.hidden=true;
});

/* ══ 토스트 ══ */
let tt;
function toast(m){const h=document.getElementById('hint');
  h.textContent=m;h.className='show';
  clearTimeout(tt);tt=setTimeout(()=>h.classList.remove('show'),2400)}
function toastUndo(m){
  const h=document.getElementById('hint');
  h.innerHTML=`${m}<button class="undo" id="uBtn">되돌리기</button>`;
  h.className='show act';
  document.getElementById('uBtn').onclick=()=>{doUndo();h.classList.remove('show','act')};
  clearTimeout(tt);tt=setTimeout(()=>h.classList.remove('show','act'),6000);
}

(async()=>{
  if(online()){
    syncMsg('불러오는 중…');
    const ok=await initSB();
    if(ok){draw();syncMsg('')}
  }else setMode();
})();
setView(view);
setTimeout(()=>{
  if(document.getElementById('uBtn'))return;   // 되돌리기 토스트가 떠 있으면 덮지 않음
  toast(isMob()
    ? '길게 눌러서 끌면 부모가 바뀝니다'
    : '노드를 끌어서 다른 사람 위에 놓으면 부모가 바뀝니다');
},600);
let rt;
addEventListener('resize',()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{if(view==='h')fit()},150);
});
addEventListener('orientationchange',()=>setTimeout(()=>{if(view==='h')fit()},300));
</script>
